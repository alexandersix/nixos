# Per-application window rules

# 1Password should always open as a floating window.
windowrule=appid:^1password$,isfloating:1,width:1200,height:1000

# Bolt Launcher should always open as a floating window.
windowrule=appid:^BoltLauncher$,isfloating:1,width:1200,height:1000

# Sushi previews should float centered at their content-driven size.
windowrule=appid:^org\.gnome\.NautilusPreviewer$,isfloating:1

# RuneLite should float centered at 60% of the monitor while ignoring its restored X11 bounds.
windowrule=appid:^net-runelite-client-RuneLite$,isfloating:1,force_tiled_state:1,isnosizehint:1,width:0.6,height:0.6,offsetx:0,offsety:0

# Telegram should float centered at its restored floating size.
windowrule=appid:^org.telegram.desktop$,isfloating:1,force_tiled_state:1,isnosizehint:1,width:808,height:632,offsetx:0,offsety:0
