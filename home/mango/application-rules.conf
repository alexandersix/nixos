# Per-application window rules

# 1Password should always open as a floating window.
window_rule=app_id:^1password$,is_floating:1,width:1200,height:1000

# Bolt Launcher should always open as a floating window.
window_rule=app_id:^BoltLauncher$,is_floating:1,width:1200,height:1000

# Sushi previews should float centered at their content-driven size.
window_rule=app_id:^org\.gnome\.NautilusPreviewer$,is_floating:1

# imv should always open as a centered floating window.
window_rule=app_id:^imv$,is_floating:1

# LocalSend should always open as a floating window.
window_rule=app_id:^localsend_app$,is_floating:1

# RuneLite should float centered at 60% of the monitor while ignoring its restored X11 bounds.
window_rule=app_id:^net-runelite-client-RuneLite$,is_floating:1,force_tiled_state:1,no_size_hint:1,width:0.6,height:0.6,offset_x:0,offset_y:0

# Satty should open as a floating annotation window at its content-driven size.
window_rule=app_id:^com\.gabm\.satty$,is_floating:1

# Telegram should float centered at its restored floating size.
window_rule=app_id:^org.telegram.desktop$,is_floating:1,force_tiled_state:1,no_size_hint:1,width:808,height:632,offset_x:0,offset_y:0
