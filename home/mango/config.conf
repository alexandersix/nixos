mousebind = SUPER,btn_left,moveresize,curmove
mousebind = SUPER,btn_right,moveresize,curresize

# Start repeating held keys sooner and repeat them slightly faster.
repeat_delay = 400
repeat_rate = 30

# Use adaptive acceleration for precise slow movement and faster cursor travel
# during quick movements, tuned toward a macOS-like response.
mouse_accel_profile = 2
mouse_accel_speed = 0.00

blur = 1
blur_layer = 0
blur_optimized = 1
blur_params_brightness = 0.900000
blur_params_contrast = 0.900000
blur_params_noise = 0.020000
blur_params_num_passes = 3
blur_params_radius = 7
blur_params_saturation = 1.000000

border_radius = 12
borderpx = 4

gappih = 12
gappiv = 12
gappoh = 12
gappov = 12

layer_animations = 0
layer_shadows = 0

monitorrule = name:^HDMI-A-1$,scale:1.333333

shadow_only_floating = 0
shadows = 0
shadows_blur = 12
shadows_position_x = 2
shadows_position_y = 2
shadows_size = 4
shadowscolor = 0x000000ff

# Show scratchpad windows on whichever monitor is focused.
scratchpad_cross_monitor = 1

# Limit the layout cycle to this ordered set.
circle_layout = dwindle,scroller,fair,center_tile

tagrule = id:1,layout_name:dwindle
tagrule = id:2,layout_name:dwindle
tagrule = id:3,layout_name:dwindle
tagrule = id:4,layout_name:dwindle
tagrule = id:5,layout_name:dwindle
tagrule = id:6,layout_name:dwindle
tagrule = id:7,layout_name:dwindle
tagrule = id:8,layout_name:dwindle
tagrule = id:9,layout_name:dwindle

xkb_rules_layout = us

exec-once=~/.config/mango/autostart.sh

source=~/.config/mango/application-rules.conf
source=~/.config/mango/noctalia.conf
