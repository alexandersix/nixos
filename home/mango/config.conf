animations = 1

# Hyprland-inspired animation profile.
#
# Hyprland's current "easy" spring for window open/move cannot be represented
# by Mango's cubic-bezier curves. easeOutQuint is Hyprland's previous window
# default (and remains one of its default curves), so it is the closest native
# Mango-style translation. Hyprland animation speeds are deciseconds; the
# durations below are their direct millisecond equivalents.
animation_type_open = zoom
animation_type_close = zoom
zoom_initial_ratio = 0.87
zoom_end_ratio = 0.87

animation_duration_open = 410
animation_duration_close = 149
animation_duration_move = 479
# Slightly quicker than Hyprland's 194 ms workspace parent/out duration.
animation_duration_tag = 180
animation_duration_focus = 303

# Hyprland: easeOutQuint
animation_curve_open = 0.23,1,0.32,1
animation_curve_move = 0.23,1,0.32,1
# Hyprland: linear
animation_curve_close = 0,0,1,1
# Snappier tag response using Hyprland's easeOutQuint.
animation_curve_tag = 0.23,1,0.32,1
# Hyprland: quick (fade/focus changes)
animation_curve_focus = 0.15,0,0.1,1

# Keep new windows fully opaque throughout the opening zoom to avoid flashing
# the background through them.
animation_fade_in = 0
animation_fade_out = 1
fadeout_begin_opacity = 1
# Hyprland's almostLinear close fade.
animation_curve_opafadeout = 0.5,0.5,0.75,1

